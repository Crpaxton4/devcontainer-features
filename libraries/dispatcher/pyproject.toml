[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dispatcher"
version = "1.2.0"
description = "Host-side task dispatcher: one Odoo task per devcontainer session, recorded as a run."
requires-python = ">=3.11"
dependencies = [
    "odoo_client",
    "usage_log",
]

[dependency-groups]
test = [
    "coverage[toml]>=7.15.2",
    "pytest>=9.1.1",
]
static-analysis = [
    "black>=26.5.1",
    "complexipy>=6.0.1",
]

[project.scripts]
dispatch = "dispatcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["tests"]

[tool.black]
target-version = ["py311"]

[tool.coverage.run]
branch = true
source = ["src/dispatcher"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.complexipy]
paths = ["src"]
max-complexity-allowed = 15
exclude = ["tests"]
output-format = ["json"]
output = "reports/complexipy/"

{% extends "base.html" %}
{% block title %}Friction{% endblock %}
{% block content %}
<h1>Friction log</h1>
{% if files %}
<ul>
  {% for f in files %}
  <li><a href="{{ url_for('friction.show', source=f.source, name=f.name) }}">{{ f.name }}</a> ({{ f.source }})</li>
  {% endfor %}
</ul>
{% else %}
<p class="empty">No friction file exists.</p>
{% endif %}
{% endblock %}

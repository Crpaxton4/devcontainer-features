<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Orchestrator{% endblock %}</title>
  <script src="{{ url_for('static', filename='htmx-2.0.4.min.js') }}"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1rem 2rem; }
    nav a { margin-right: 1rem; }
    table { border-collapse: collapse; margin-bottom: 1.5rem; }
    th, td { border: 1px solid #ccc; padding: 0.2rem 0.5rem; text-align: left; font-size: 0.9rem; }
    pre { background: #f5f5f5; padding: 0.5rem; overflow-x: auto; }
    .empty { color: #777; }
  </style>
</head>
<body>
  <nav>
    {% block nav %}
    {% for label, endpoint in nav_pages %}<a href="{{ url_for(endpoint) }}">{{ label }}</a>{% endfor %}
    {% endblock %}
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo_dev_data"
version = "9.1.0"
description = "Data layer of the odoo-dev suite: the ODOO_DEV_HOME state root, config.toml, state.db and the stores on it."
requires-python = ">=3.10"
dependencies = [
    # tomllib is stdlib from Python 3.11; tomli backfills it on 3.10.
    "tomli>=2.0.1; python_version < '3.11'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.black]
target-version = ["py310"]

[tool.complexipy]
paths = ["src"]
max-complexity-allowed = 15

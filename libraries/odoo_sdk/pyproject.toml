[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo_sdk"
version = "6.4.0"
description = "Python SDK for Odoo XML-RPC access and command dispatch helpers."
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4,<5",
    "markdown-it-py>=3.0.0",
    "markitdown[docx,pdf]>=0.1.6",
    "pydantic>=2.13.4",
    "textual>=1.0.0",
    "toon-format>=0.9.0b1",
    # `tomllib` is stdlib only from 3.11; on the 3.10 floor (odoo:17) the
    # API-compatible backport supplies the TOML config parser instead.
    "tomli>=2.0.1; python_version < '3.11'",
]

[dependency-groups]
static-analysis = [
    "black>=26.5.1",
    "complexipy>=6.0.1",
    "import-linter>=2.3",
    "pygount>=3.2.0",
    "radon>=6.0.1",
]
docs = [
    "furo>=2024.8.6",
    "ipykernel>=6.29.0",
    "jupyterlab>=4.6.1",
    "myst-parser>=3.0,<5",
    "nbsphinx>=0.9.0",
    "sphinx>=7.0,<9",
    "sphinx-autodoc-typehints>=2.0,<3.11",
]
test = [
    "coverage[toml]>=7.15.2",
    "hypothesis>=6.157.1",
    "cosmic-ray>=8.4.6",
]
dev = [
    {include-group = "static-analysis"},
    {include-group = "docs"},
    {include-group = "test"},
    "pytest>=9.1.1",
]

[project.scripts]
odoo-mcp = "odoo_sdk.mcp.__main__:main"
odoo-tui = "odoo_sdk.tui.__main__:main"
odoo-sdk = "odoo_sdk.cli.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]
# Packaged consulting skills (odoo_sdk/skills/<name>/SKILL.md): the source of
# truth the MCP prompts read and SkillsDirectoryProvider serves.
"odoo_sdk" = ["skills/*/SKILL.md", "skills/*/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.black]
target-version = ["py310"]

[tool.coverage.run]
branch = true
source = ["src/odoo_sdk"]
omit = ["*/examples/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "reports/coverage/html"

[tool.coverage.json]
output = "reports/coverage/coverage.json"
pretty_print = true

[tool.radon]
exclude = "tests/*,examples/*"
cc_min = "A"
show_complexity = true
average = true
show_mi = true

[tool.complexipy]
paths = ["src"]
max-complexity-allowed = 15
exclude = ["tests", "examples", "build", "htmlcov"]
output-format = ["json"]
output = "reports/complexipy/"

# ── ADR-005 layering contracts ──────────────────────────────────────────────
# Layer model (docs/source/design/architecture/ADR-005): surface (cli, mcp,
# tui) / core (commands, billing, sessionization, tracking, skills, and —
# promoted by #718 — the records/query domain types) / data (transport,
# client, fields, env, state, adapters, services) + shared kernel (_utils,
# errors, settings). Every ignore entry below is either marked "permanent"
# (a named ADR-005 exception) or carries the issue that deletes it;
# `unmatched_ignore_imports_alerting = "error"` means the lists can only
# shrink. Adding a NEW entry requires an ADR-005 amendment in the same PR.
#
# Shim modules are EXCLUDED from every contract list by design:
# `odoo_sdk.utilities` (per-module aliasing shims + the genuinely shared
# `utilities.html`), `odoo_sdk.reap`, `odoo_sdk.prune` (#717), and
# `odoo_sdk.adapters.state_persistence` (#718) re-export their relocated
# modules across layers on purpose (a shim preserves the OLD import graph),
# so listing them would only force ignore entries that restate the shim's
# job. The canonical homes (`services`, `tracking`, `mcp.prompts`,
# `settings`, `adapters.state`) ARE listed and enforced. The
# `odoo_sdk.state.models` alias (#718) is the one shim that cannot be
# unlisted (it lives inside the listed `state` package), so its single
# re-export edge is an explicit permanent ignore instead.
[tool.importlinter]
root_packages = ["odoo_sdk"]

[[tool.importlinter.contracts]]
name = "ADR-005 rule 1: surfaces are mutually independent (cli / mcp / tui)"
type = "independence"
modules = [
    "odoo_sdk.cli",
    "odoo_sdk.mcp",
    "odoo_sdk.tui",
]
ignore_imports = [
    # permanent (ADR-005 named exception, #714): sync-skills' --target-dir
    # mode is *defined* as "what an MCP client would sync from the running
    # server", so the CLI builds the in-process OdooMCPServer itself. The
    # import is function-local, so the --dest parity path never loads fastmcp.
    "odoo_sdk.cli.sync_skills -> odoo_sdk.mcp.server",
]

# The root façade (odoo_sdk/__init__.py) is deliberately outside the source
# list: its PEP 562 lazy `OdooMCPServer` export is the one sanctioned
# below-surface reference to a surface module (ADR-005 named exception).
[[tool.importlinter.contracts]]
name = "ADR-005 rule 2: nothing below a surface imports a surface"
type = "forbidden"
source_modules = [
    # core (records/query promoted by #718: the recordset-first domain
    # types the public API is built around)
    "odoo_sdk.commands",
    "odoo_sdk.billing",
    "odoo_sdk.sessionization",
    "odoo_sdk.tracking",
    "odoo_sdk.skills",
    "odoo_sdk.records",
    "odoo_sdk.query",
    # data
    "odoo_sdk.transport",
    "odoo_sdk.client",
    "odoo_sdk.fields",
    "odoo_sdk.env",
    "odoo_sdk.state",
    "odoo_sdk.adapters",
    "odoo_sdk.services",
    # shared kernel
    "odoo_sdk._utils",
    "odoo_sdk.errors",
    "odoo_sdk.settings",
]
forbidden_modules = [
    "odoo_sdk.cli",
    "odoo_sdk.mcp",
    "odoo_sdk.tui",
]

[[tool.importlinter.contracts]]
name = "ADR-005 rule 3: data does not import core"
type = "forbidden"
source_modules = [
    "odoo_sdk.transport",
    "odoo_sdk.client",
    "odoo_sdk.fields",
    "odoo_sdk.env",
    "odoo_sdk.state",
    "odoo_sdk.adapters",
    "odoo_sdk.services",
]
forbidden_modules = [
    "odoo_sdk.commands",
    "odoo_sdk.billing",
    "odoo_sdk.sessionization",
    "odoo_sdk.tracking",
    "odoo_sdk.skills",
    # promoted core domain types (#718)
    "odoo_sdk.records",
    "odoo_sdk.query",
]
ignore_imports = [
    # permanent (ADR-005): adapters borrow the sessionization event
    # vocabulary (pure frozen models), not behaviour. (Paths updated by
    # #718's per-system adapter packages.)
    "odoo_sdk.adapters.state.persistence -> odoo_sdk.sessionization",
    "odoo_sdk.adapters.google.sync -> odoo_sdk.sessionization.config",
    # permanent (ADR-005 amendment, #718): the client is the adapter behind
    # the RpcClient port, and OdooRecordset is that port's return type — an
    # adapter naming the domain type it produces is the sanctioned
    # hexagonal direction.
    "odoo_sdk.client.client -> odoo_sdk.records.recordset",
    # permanent (ADR-005 amendment, #718): the state.models alias re-exports
    # the promoted tracker vocabulary (sys.modules aliasing; the one shim
    # that lives inside a listed package).
    "odoo_sdk.state.models -> odoo_sdk.tracking.models",
]
unmatched_ignore_imports_alerting = "error"

# Direct-only on purpose (`allow_indirect_imports`): surface -> core -> data
# chains are exactly the sanctioned path.
[[tool.importlinter.contracts]]
name = "ADR-005 rule 4: surfaces reach data only through core"
type = "forbidden"
source_modules = [
    "odoo_sdk.cli",
    "odoo_sdk.mcp",
    "odoo_sdk.tui",
]
forbidden_modules = [
    "odoo_sdk.transport",
    "odoo_sdk.client",
    "odoo_sdk.fields",
    "odoo_sdk.env",
    "odoo_sdk.state",
    "odoo_sdk.adapters",
    "odoo_sdk.services",
]
allow_indirect_imports = true
# The baseline-debt register is EMPTY (#718): the last nine surface->data
# entries were retired by the StateStore/SettingsView ports, the promoted
# tracker vocabulary (tracking.models), the errors kernel façade, and the
# core doors tracking.events / billing.logged. (#716 retired the three
# per-entrypoint composition-root entries via odoo_sdk.bootstrap; #717
# retired cli.__main__ -> adapters; #713 retired mcp.server -> state.models.)
# A new entry requires an ADR-005 amendment in the same PR.

# odoo_sdk.bootstrap is the single composition root (#716): the ONE module
# allowed to touch every layer, which it is granted by being outside every
# source list in rules 1-4. The price of that freedom is this rule: nothing
# imports the composition root except the three surface entrypoints (tests
# live outside the package and are unconstrained).
[[tool.importlinter.contracts]]
name = "ADR-005 rule 5: only the entrypoints import the composition root"
type = "forbidden"
source_modules = [
    # surfaces
    "odoo_sdk.cli",
    "odoo_sdk.mcp",
    "odoo_sdk.tui",
    # core
    "odoo_sdk.commands",
    "odoo_sdk.billing",
    "odoo_sdk.sessionization",
    "odoo_sdk.tracking",
    "odoo_sdk.skills",
    # data
    "odoo_sdk.transport",
    "odoo_sdk.client",
    "odoo_sdk.records",
    "odoo_sdk.query",
    "odoo_sdk.fields",
    "odoo_sdk.env",
    "odoo_sdk.state",
    "odoo_sdk.adapters",
    "odoo_sdk.services",
    # shared kernel
    "odoo_sdk._utils",
    "odoo_sdk.errors",
    "odoo_sdk.settings",
]
forbidden_modules = [
    "odoo_sdk.bootstrap",
]
ignore_imports = [
    # permanent: composition root — the three entrypoints are the only
    # sanctioned importers of the assembled object graph.
    "odoo_sdk.cli.__main__ -> odoo_sdk.bootstrap",
    "odoo_sdk.mcp.__main__ -> odoo_sdk.bootstrap",
    "odoo_sdk.tui.__main__ -> odoo_sdk.bootstrap",
]
unmatched_ignore_imports_alerting = "error"

# The #718 endgame: EXHAUSTIVE layer membership. Every direct child of
# odoo_sdk must claim a layer here (or be a named exhaustive_ignores
# exception), so an unclassified new module fails CI instead of silently
# escaping rules 1-5. Within a layer, ":"-separated siblings may import each
# other (surface independence stays rule 1's job, so its one named exception
# is not restated here); a lower layer importing a higher one is a contract
# break. The upward exceptions duplicate rule 3's permanent vocabulary/alias
# entries plus the settings kernel's lazy resolver seam — every one is an
# ADR-005 named exception.
[[tool.importlinter.contracts]]
name = "ADR-005 rule 6: exhaustive layer map — unclassified new modules fail CI"
type = "layers"
containers = ["odoo_sdk"]
exhaustive = true
exhaustive_ignores = [
    # composition root: the ONE module allowed to name every layer (#716);
    # rule 5 already guards who may import it.
    "bootstrap",
    # shared-kernel façade re-exporting the data/core error taxonomies by
    # design (ADR-005): listing it in the kernel layer would only restate
    # its job as ignores.
    "errors",
    # deprecation shims (#717) + the genuinely shared utilities.html.
    "utilities",
    "prune",
    "reap",
]
layers = [
    "cli : mcp : tui",
    "commands : billing : sessionization : tracking : skills : records : query",
    "transport : client : fields : env : state : adapters : services",
    "_utils : settings",
]
ignore_imports = [
    # permanent (ADR-005): the sessionization event vocabulary borrowed by
    # the persistence/google adapters (rule 3's entries, restated for this
    # contract's lens).
    "odoo_sdk.adapters.state.persistence -> odoo_sdk.sessionization",
    "odoo_sdk.adapters.google.sync -> odoo_sdk.sessionization.config",
    # permanent (ADR-005 amendment, #718): adapter names the domain type its
    # port returns.
    "odoo_sdk.client.client -> odoo_sdk.records.recordset",
    # permanent (ADR-005 amendment, #718): the state.models alias re-exports
    # the promoted tracker vocabulary.
    "odoo_sdk.state.models -> odoo_sdk.tracking.models",
    # permanent (ADR-005, #717): the settings kernel's one seam back into
    # the resolver — OdooConnectionSettings.from_sources imports LocalConfig
    # lazily inside the call, and grimp sees function-body imports.
    "odoo_sdk.settings -> odoo_sdk.state.config",
]
unmatched_ignore_imports_alerting = "error"

[tool.uv]
# ``toon-format`` currently ships its first functional encoder only as a
# pre-release, so allow uv to resolve pre-release versions.
prerelease = "allow"

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
odoo_sdk = { workspace = true }

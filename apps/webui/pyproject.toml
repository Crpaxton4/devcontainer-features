[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "webui"
version = "9.4.0"
description = "Local web interface, read-only except for answers to job questions, for the dispatcher's jobs, the orchestrator queue and the friction log."
requires-python = ">=3.11"
# Jinja2 comes with Flask. Pages read through dispatcher.reporting only.
dependencies = [
    "flask>=3.1",
    "dispatcher",
]

[dependency-groups]
test = [
    "pytest>=9.1.1",
]
static-analysis = [
    "black>=26.5.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
webui = ["templates/*.html", "static/*"]

[tool.black]
target-version = ["py311"]

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Orchestrator{% endblock %}</title>
  <script src="{{ url_for('static', filename='htmx-2.0.4.min.js') }}"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1rem 2rem; }
    nav a { margin-right: 1rem; }
    table { border-collapse: collapse; margin-bottom: 1.5rem; }
    th, td { border: 1px solid #ccc; padding: 0.2rem 0.5rem; text-align: left; font-size: 0.9rem; }
    pre { background: #f5f5f5; padding: 0.5rem; overflow-x: auto; }
    .empty { color: #777; }
    /* Split page: the viewport holds two fixed halves, and only a half scrolls.
       minmax(0, 1fr) lets a half stay narrower than its widest line. */
    body.split { height: 100vh; margin: 0; padding: 1rem 2rem; box-sizing: border-box;
                 display: flex; flex-direction: column; }
    body.split main { flex: 1; min-height: 0; }
    .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2rem; height: 100%; }
    .cols > * { min-width: 0; overflow: auto; }
    .cols h1 { overflow-wrap: anywhere; }
    .cols td, pre.wrap { white-space: pre-wrap; overflow-wrap: anywhere; }
    .cols input { max-width: 100%; }
    /* The stream keeps one event per line; its half scrolls, not the pre. */
    .transcript { white-space: pre; overflow: visible; width: max-content; min-width: 100%; box-sizing: border-box; }
  </style>
</head>
<body class="{% block body_class %}{% endblock %}">
  <nav>
    {% block nav %}
    {% for label, endpoint in nav_pages %}<a href="{{ url_for(endpoint) }}">{{ label }}</a>{% endfor %}
    {% endblock %}
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>

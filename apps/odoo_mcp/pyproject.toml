[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo_mcp"
version = "9.3.0"
description = "MCP server app of the odoo-dev suite: the odoo-mcp entry point."
requires-python = ">=3.10"
dependencies = [
    "odoo_dev_core",
    "fastmcp>=4,<5",
    "toon-format>=0.9.0b1",
]

[project.scripts]
odoo-mcp = "odoo_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.black]
target-version = ["py310"]

[tool.complexipy]
paths = ["src"]
max-complexity-allowed = 15

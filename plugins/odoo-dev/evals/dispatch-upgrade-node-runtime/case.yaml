schema_version: "1.1"
name: dispatch-upgrade-node-runtime
description: Near miss — an upgrade with two version numbers, but nothing to do with Odoo.
tags: [trigger, negative, validation]
plugins: [odoo-dev]
execution:
  prompt: |
    Upgrade this repo's Node runtime from 20 to 22 and fix whatever breaks in the build.
  max_turns: 3
  timeout_seconds: 180
runs: 2
graders:
  - type: tool_used
    name: no-odoo-dev-upgrader
    tool: Task
    input_match: "odoo-dev-upgrader"
    max: 0
  - type: tool_used
    name: no-odoo-dev-skill
    tool: Skill
    input_match: "odoo-dev"
    max: 0
expected_outcome: No odoo-dev subagent is spawned and no odoo-dev skill fires; the request is out of domain.

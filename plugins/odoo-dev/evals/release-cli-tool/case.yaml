schema_version: "1.1"
name: release-cli-tool
description: Near miss — shares a trigger word with an odoo-dev skill but is out of domain (release).
tags: [trigger, negative, validation]
plugins: [odoo-dev]
execution:
  prompt: |
    Cut a release of this Go CLI tool and publish the binaries.
  max_turns: 3
  timeout_seconds: 180
runs: 2
graders:
  - type: tool_used
    name: no-odoo-dev-skill
    tool: Skill
    input_match: "odoo-dev"
    max: 0
expected_outcome: No odoo-dev skill fires; the request is out of domain.

schema_version: "1.1"
name: estimate-split-hours
description: Should fire odoo-dev:fibonacci-estimate, and only that skill.
tags: [trigger, positive, train]
plugins: [odoo-dev]
execution:
  prompt: |
    Split this estimate into subtasks and re-cut the numbers with a 20% reduction factor. Hours, not points.
  max_turns: 3
  timeout_seconds: 180
runs: 2
graders:
  - type: tool_used
    name: fires-fibonacci-estimate
    tool: Skill
    input_match: "fibonacci-estimate"
    min: 1
  - type: tool_used
    name: does-not-fire-odoo-quote
    tool: Skill
    input_match: "odoo-quote"
    max: 0
expected_outcome: >-
  The fibonacci-estimate skill is invoked and odoo-quote is not. The numbers on an
  estimate that already exists are the whole job here: there is no client, no Odoo
  project to pull context from, and no quote document to write. odoo-quote firing
  as well is the double-fire the two descriptions were rewritten to stop.

schema_version: "1.1"
name: estimate-split-hours
description: Should fire odoo-dev:estimate for a re-cut of existing numbers.
tags: [trigger, positive, train]
plugins: [odoo-dev]
execution:
  prompt: |
    Split this estimate into subtasks and re-cut the numbers with a 20% reduction factor. Hours, not points.
  max_turns: 3
  timeout_seconds: 180
runs: 2
graders:
  - type: tool_used
    name: fires-estimate
    tool: Skill
    input_match: "estimate"
    min: 1
expected_outcome: >-
  The estimate skill is invoked. The numbers on an estimate that already exists are
  the whole job here: there is no client, no Odoo project to pull context from, and
  no document to write, so the generic estimate skill fires on its own.

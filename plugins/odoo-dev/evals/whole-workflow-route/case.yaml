schema_version: "1.1"
name: whole-workflow-route
description: Should fire odoo-dev:odoo-dev-map.
tags: [trigger, positive, validation]
plugins: [odoo-dev]
execution:
  prompt: |
    I've got a new client change request that needs scoping, building and shipping. What's the order of operations and who does each step?
  max_turns: 3
  timeout_seconds: 180
runs: 2
graders:
  - type: tool_used
    name: fires-odoo-dev-map
    tool: Skill
    input_match: "odoo-dev-map"
    min: 1
expected_outcome: The odoo-dev-map skill is invoked.

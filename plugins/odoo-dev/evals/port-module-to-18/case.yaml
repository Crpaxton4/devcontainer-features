schema_version: "1.1"
name: port-module-to-18
description: Should fire odoo-dev:odoo-upgrade.
tags: [trigger, positive, validation]
plugins: [odoo-dev]
execution:
  prompt: |
    Port this custom addon from 17.0 to 18.0 and tell me what breaks.
  max_turns: 3
  timeout_seconds: 180
runs: 2
graders:
  - type: tool_used
    name: fires-odoo-upgrade
    tool: Skill
    input_match: "odoo-upgrade"
    min: 1
expected_outcome: The odoo-upgrade skill is invoked.

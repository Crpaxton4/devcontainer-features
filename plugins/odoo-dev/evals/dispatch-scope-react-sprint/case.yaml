schema_version: "1.1"
name: dispatch-scope-react-sprint
description: Near miss — scoping and sizing language, but the product is not Odoo.
tags: [trigger, negative, train]
plugins: [odoo-dev]
execution:
  prompt: |
    Scope out next sprint's work on our React dashboard and size it — rough t-shirt sizes are fine, no need for hours.
  max_turns: 3
  timeout_seconds: 180
runs: 2
graders:
  - type: tool_used
    name: no-odoo-dev-builder
    tool: Task
    input_match: "odoo-dev-builder"
    max: 0
  - type: tool_used
    name: no-odoo-dev-tester
    tool: Task
    input_match: "odoo-dev-tester"
    max: 0
  - type: tool_used
    name: no-odoo-dev-pr
    tool: Task
    input_match: "odoo-dev-pr"
    max: 0
  - type: tool_used
    name: no-odoo-dev-upgrader
    tool: Task
    input_match: "odoo-dev-upgrader"
    max: 0
  - type: tool_used
    name: no-odoo-prior-art
    tool: Skill
    input_match: "odoo-prior-art"
    max: 0
expected_outcome: >-
  No odoo-dev subagent is spawned and the Odoo prior-art skill does not fire; the
  product is not Odoo. The generic estimate skill may fire on a React sprint, and
  that is correct: it is not Odoo-specific.

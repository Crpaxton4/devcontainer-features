schema_version: "1.1"
name: dispatch-scope-react-sprint
description: Near miss — scoping and sizing language, but the product is not Odoo.
tags: [trigger, negative, train]
plugins: [odoo-dev]
execution:
  prompt: |
    Scope out next sprint's work on our React dashboard and size it — rough t-shirt sizes are fine, no need for hours.
  max_turns: 3
  timeout_seconds: 180
runs: 2
graders:
  - type: tool_used
    name: no-odoo-dev-scoper
    tool: Task
    input_match: "odoo-dev-scoper"
    max: 0
  - type: tool_used
    name: no-odoo-dev-skill
    tool: Skill
    input_match: "odoo-dev"
    max: 0
expected_outcome: No odoo-dev subagent is spawned and no odoo-dev skill fires; the request is out of domain.

schema_version: "1.1"
name: ci-build-status
description: Near miss — shares a trigger word with an odoo-dev skill but is out of domain (status).
tags: [trigger, negative, train]
plugins: [odoo-dev]
execution:
  prompt: |
    What's the status of the CI build on this branch?
  max_turns: 3
  timeout_seconds: 180
runs: 2
graders:
  - type: tool_used
    name: no-odoo-dev-skill
    tool: Skill
    input_match: "odoo-dev"
    max: 0
expected_outcome: No odoo-dev skill fires; the request is out of domain.

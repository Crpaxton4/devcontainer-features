schema_version: "1.1"
name: review-react-component
description: Near miss — shares a trigger word with an odoo-dev skill but is out of domain (review).
tags: [trigger, negative, train]
plugins: [odoo-dev]
execution:
  prompt: |
    Review this React component for unnecessary re-renders.
  max_turns: 3
  timeout_seconds: 180
runs: 2
graders:
  - type: tool_used
    name: no-odoo-dev-skill
    tool: Skill
    input_match: "odoo-dev"
    max: 0
expected_outcome: No odoo-dev skill fires; the request is out of domain.

name: "CI - webui quality"

on:
  push:
    branches:
      - main
    paths:
      - 'libraries/webui/**'
      - '.github/workflows/webui.yaml'
  pull_request:
    paths:
      - 'libraries/webui/**'
      - '.github/workflows/webui.yaml'
  workflow_dispatch:

defaults:
  run:
    working-directory: libraries/webui

jobs:
  tests:
    name: "Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Check uv.lock is up to date
        run: uv lock --check

      - name: Install test dependencies
        run: uv sync --group test

      - name: Run tests
        run: uv run pytest -q

  static:
    name: "Static Analysis"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install static analysis dependencies
        run: uv sync --group static-analysis

      - name: Check formatting
        run: uv run black --check src tests

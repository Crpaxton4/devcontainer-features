name: "Release dev container features"
on:
  workflow_dispatch:
  workflow_call:

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: "Set up uv"
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: "Bundle Python libraries into feature"
        run: |
          uv build --directory libraries/odoo_sdk
          cp libraries/odoo_sdk/dist/*.whl devcontainer-features/src/personal-features/

      - name: "Publish Features"
        uses: devcontainers/action@v1
        with:
          publish-features: "true"
          base-path-to-features: "./devcontainer-features/src"
          generate-docs: "false"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

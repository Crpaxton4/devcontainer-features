name: "CI - docs"

on:
  push:
    branches:
      - main
    paths:
      - 'libraries/*/src/**'
      - 'apps/*/src/**'
      - 'docs/**'
      - 'pyproject.toml'
      - '.github/workflows/docs.yaml'
  pull_request:
    paths:
      - 'libraries/*/src/**'
      - 'apps/*/src/**'
      - 'docs/**'
      - 'pyproject.toml'
      - '.github/workflows/docs.yaml'
  workflow_dispatch:

# Read-only by default; the deploy job widens this for GitHub Pages.
permissions:
  contents: read

jobs:
  build:
    name: "Build docs (warnings-as-errors)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install docs dependencies
        run: uv sync --all-packages --group docs

      # -W turns Sphinx warnings into errors, so a broken cross-reference or a
      # malformed page fails the build.
      - name: Build HTML docs
        run: uv run sphinx-build -W -b html docs docs/_build/html

      - name: Check links
        run: uv run sphinx-build -b linkcheck docs docs/_build/linkcheck

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    name: "Deploy to GitHub Pages"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    # Serialize deployments without serializing PR docs builds.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

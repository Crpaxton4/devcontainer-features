name: "CI - Test Features on QOC prebuilt images"

# test.yaml proves personal-features installs on upstream odoo:N - but no QOC
# project builds on upstream odoo:N. Every project devcontainer runs on
# ghcr.io/qoc-innovations/qoc-devcontainer:<tag>, built FROM odoo:N by
# QOC-Innovations/.devcontainer (images/odoo/Dockerfile.base), and layers this
# repo's Features on top. That published image is what broke on 2026-10-02:
# odoo:16 is Debian 11 (bullseye), bullseye left LTS on 2026-08-31, and
# deb.debian.org started tearing down its bullseye-security pool - the Release
# files still serve, the .debs 404 - so the first Feature to run apt-get
# (docker-outside-of-docker, a dependsOn of personal-features) failed every
# Odoo 16 rebuild with "404 Not Found". test.yaml was green throughout, because
# #691 had repointed its odoo:16 FIXTURE at the EOL archives: right for a
# fixture, and exactly the repair the product image never received. A test
# that patches the base cannot see that the real base is unpatched.
#
# So this workflow builds the actual consumer stack - the published image plus
# the Features every project adds - and it runs on a schedule, because the
# failure it hunts arrives without a commit: a mirror is torn down, upstream
# rebuilds, a Feature dependency starts needing a package the image cannot
# fetch. A leg that only runs on push can never see any of that. It is a
# canary, not a required check: when it goes red the fix is normally in the
# image repo (repoint the EOL suite at the archives, rebuild), not here.
#
# The images are private, so the job needs a token that can read packages in
# the QOC-Innovations org:
#   secrets.QOC_GHCR_READ_TOKEN   classic PAT with read:packages
#   vars.QOC_GHCR_USERNAME        login of the PAT's owner (default: cpqoc)
# Secrets are withheld from pull_request runs out of forks and from
# dependabot[bot], so those are skipped rather than failed; everything else
# (same-repo PRs, pushes to main, the schedule, manual runs) fails loudly
# without the token instead of silently testing nothing.
on:
  schedule:
    # Daily, ~1.5h after the image repo's 08:17 UTC upstream-digest check so a
    # nightly rebuild there is what gets tested here.
    - cron: "41 9 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    # Each leg pulls a multi-GB image and runs a full Feature build, so PRs
    # only pay for it when they touch what the legs exercise. Pushes to main
    # and the schedule are unfiltered.
    paths:
      - "devcontainer-features/**"
      - "libraries/odoo_sdk/**"
      - "setup.sh"
      - ".github/workflows/test-prebuilt-images.yaml"

# Pinned @devcontainers/cli version, kept in step with test.yaml (its
# DEVCONTAINERS_CLI_VERSION comment explains the manual refresh).
env:
  DEVCONTAINERS_CLI_VERSION: "0.87.0"
  # second-brain bind-mounts ${localEnv:SECOND_BRAIN_DIR}; see test.yaml's
  # test-second-brain job for why it has to be exported to the CLI's process.
  SECOND_BRAIN_DIR: /tmp/second-brain-kb

jobs:
  test-prebuilt-images:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    strategy:
      # Four independent images; one EOL base must not erase the other three
      # verdicts (see the note on test-autogenerated in test.yaml, #688).
      fail-fast: false
      matrix:
        features:
          - personal-features
        scenario:
          - on_qoc_prebuilt_16
          - on_qoc_prebuilt_17
          - on_qoc_prebuilt_18
          - on_qoc_prebuilt_19
    steps:
      - uses: actions/checkout@v7

      - name: "Require the GHCR read token"
        env:
          QOC_GHCR_READ_TOKEN: ${{ secrets.QOC_GHCR_READ_TOKEN }}
        run: |
          if [ -z "$QOC_GHCR_READ_TOKEN" ]; then
            echo "::error::secrets.QOC_GHCR_READ_TOKEN is not set, so ghcr.io/qoc-innovations/qoc-devcontainer cannot be pulled. Add a classic PAT with read:packages on the QOC-Innovations org (and vars.QOC_GHCR_USERNAME if its owner is not cpqoc)."
            exit 1
          fi

      - name: "Log in to GitHub Container Registry"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ vars.QOC_GHCR_USERNAME || 'cpqoc' }}
          password: ${{ secrets.QOC_GHCR_READ_TOKEN }}

      - name: Cache npm global store
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-devcontainers-cli-${{ env.DEVCONTAINERS_CLI_VERSION }}

      - name: "Install pinned devcontainer CLI"
        run: npm install -g @devcontainers/cli@${{ env.DEVCONTAINERS_CLI_VERSION }}

      - name: "Set up uv"
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: "Bundle Python libraries into feature"
        run: |
          uv build --directory libraries/odoo_sdk
          cp libraries/odoo_sdk/dist/*.whl devcontainer-features/src/personal-features/

      # Same script consumers run, so the mount-source list stays defined in
      # exactly one place (#198).
      - name: "Create bind mount source paths on runner"
        run: sh ./setup.sh

      # Mirrors test.yaml's test-second-brain seeding: the mount source must
      # exist on the host, be writable by whatever uid the container runs as,
      # and carry a sentinel the scenario can assert host content through.
      - name: "Create and seed the knowledge-base directory on the runner"
        run: |
          mkdir -p "$SECOND_BRAIN_DIR"
          chmod 0777 "$SECOND_BRAIN_DIR"
          echo 'host knowledge survives' > "$SECOND_BRAIN_DIR/host-sentinel.md"

      - name: "Generating tests for '${{ matrix.features }}' scenario '${{ matrix.scenario }}'"
        run: devcontainer features test -p ./devcontainer-features -f ${{ matrix.features }} --skip-autogenerated --skip-duplicated --filter ${{ matrix.scenario }} .
